<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes e Cores</title>
    <style text="text/css">
        .fonteSerif {
        font-family: "Times New Roman", 'Times New Roman', Times, serif;
        font-size: 80 px;
        font-style: normal;
        }

        .fonteSans-Serif {
        font-family: "Verdana", Arial, Helvetica, sans-serif ;
        font-size: 40 px;
        font-style: oblique;

        }

        .fonteMonospace {
        font-family: "Courier New",;
        font-size: 20 px;
        font-style: italic;

        }

    </style>
</head>
<body>
    <p class="fonteSerif">Programação Web</p>
    <p class="fonteSans-Serif">Programação Web</p>
    <p class="fonteMonospace">Programação Web</p>

</body>
</html>
