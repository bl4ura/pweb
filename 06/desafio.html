<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Web com div</title>

    <style type="text/css">
body {
  font-family: Arial;
    margin: 0;
    padding: 0;
}


.header {
    color: white;
    text-align: center;
    padding: 20px;
  background-color: #4caf50
}

.main-content {
 background-color: #f3f3f3;
     width: 20%;
    float: left;
    padding: 20px;
    box-sizing: border-box;

.sidebar {
 background-color:#E0E1E0;
    width: 20%;
    float: left;
    padding: 20px;
    box-sizing: border-box;
}

.footer {
 background-color: #383838; 
 color: white;
  text-align: center;
    padding: 15px;
    clear: both;
}

    </style> 
</head>
<body>

    <div class="header">
        <h1> Minha Página Web</h1>
 
    </div> 

    <div class="main-content">
        <p>Este é o conteúdo principal da página. </p>
        <p>Adicione mais parágrafos ou elementos conforme necessário. </p>
    </div>

    <div class="sidebar">
        <ul>
            <li>Item 1 </li>
            <li>Item 2 </li>
            <li>Item 3 </li>
        </ul>
    </div> 

    <div class="footer">
        <p>Rodapé da Página</p>
    </div>

</body>
</html>
