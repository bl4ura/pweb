<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Web com div</title>

    <style type="text/css">
body {
    font-family: Arial;
    margin: 0;
}


.header {
    background-color: #50B354
    color: white;
    text-align: center;
    padding: 20px;
}

.content{
    display: flex;

    margin: 20px;
    
    gap: 20px;
}


.main-content {
    background-color: #F3F3F3;
     width: 75%;
    float: right;
    padding: 20px;
    box-sizing: border-box;
}


.sidebar {
    background-color:#E0E1E0;
    width: 25%;
    float: left;
    padding: 20px;
    box-sizing: border-box;
}


.footer {
    background-color: #383838; 
    color: white;
    text-align: center;
    padding: 15px;
    margin: 20px;
    clear: both;
}

    </style> 
</head>
<body>

    <div class="header">
        <h1> Minha Página Web</h1>
 
    </div> 

    <div class="main-content">
        <p>Este é o conteúdo principal da página. </p>
        <p>Adicione mais parágrafos ou elementos conforme necessário. </p>
    </div>

   
    <div class="sidebar">
    
         <ul>
             <li>Item 1 </li>
             <li>Item 2 </li>
             <li>Item 3 </li>
         </ul>
    </div> 

    <div class="footer">
        <p>Rodapé da Página</p>
    </div>

</body>
</html>
