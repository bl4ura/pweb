<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>

    <style type="text/css">
        body{
            background: #61bd8c;
        }

        .caixa{
            background-color: red;
            margin: 10px;
            width: 100px;
            height: 100px;
            color: #ffffff;
        }

        #conteudo{
            background: #ffffff;
            padding: 10px;
            width: 900px;
            margin: 30px auto;
        }

        #relativo{
            position: relative;
            left: 30px;
        }

        #absoluto{
            position: absolute;
            left: 30px;
        }

        #fixo{
            position: fixed;
            left: 200px;
            top: 0px;
        }

    </style>
</head>
<body>
        <span>Container body</span>

        <div id="menu">
        <a href="galeria.html">Galeria</a>
        </div>

        <div id="conteudo">
            Container div
            <div id="relativo" class="caixa">
                Relativo
            </div>

            <div id="absoluto" class="caixa">
                Absoluto
            </div>

            <div id="fixo" class="caixa">
                Fixo
            </div>
        </div>

        
    <br>
    




        </div>
    
</body>
</html>
