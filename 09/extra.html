<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra</title>
    <style type="text/css">
        body{
            margin: 0;
        }

        #container{
            display: flex;
            margin-top: 50px;
        }

        #header{
            background-color: lightblue;
            position: fixed;
            top: 0px;
            left: 0;
            width: 100%;
            height: 50px;
                        

        }

        #left{
            background-color: lightcoral;
            float: left;
            width: 33.33%;
            height: 400px;
            margin-top: 50px;

        }

        #center{
            background-color: lightgreen;
            float: left;
            width: 33.33%;
            height: 400px;
            box-sizing: border-box;


        }

        #right{
            background-color: lightcoral;
            float: left;
            width: 33.34%;
            height: 400px;
            box-sizing: border-box;

        }

        #footer{
            background-color: lightpink;
            height: 50px;
            clear: both;


        }
    </style>

</head>
<body>
    <div id="header">
        Header 100%
    </div>

    <div id="container">
    <div id="left">
        Left 25%
    </div>

    <div id="center">
        Center 50%
    </div>

    <div id="right">
        Right 25%
    </div>

    <div id="footer">
        Footer 100%
    </div>
</div>

</body>
</html>
