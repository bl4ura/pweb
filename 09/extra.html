<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra</title>
    <style type="text/css">
        body{
            margin: 0;
        }

        #container{
            display: flex;
            flex-wrap: wrap;
        }

        #header{
            background-color: lightblue;
            position: fixed;
            top: 0px;
        }

        #left{
            background-color: lightcoral;

        }

        #center{
            background-color: lightgreen;

        }

        #right{
            background-color: lightcoral;

        }

        #footer{
            background-color: lightpink;

        }
    </style>

</head>
<body>
    <div id="header">
        Header 100%
    </div>

    <div id="left">
        Left 25%
    </div>

    <div id="center">
        Center 50%
    </div>

    <div id="right">
        Right 25%
    </div>

    <div id="footer">
        Footer 100%
    </div>

</body>
</html>
