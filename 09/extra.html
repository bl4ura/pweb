<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra</title>
    <style type="text/css">
        body{
            margin: 0;
            padding: 0;
        }

        .container{
            display: flex;
            margin-top: 50px;
        }

        .header{
            background-color: lightblue;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;  
            height: 10%;                      

        }

        .left{
            background-color: lightcoral;
            width: 33.33%;
            height: 80%;                      

        }

        .center{
            background-color: lightgreen;
            width: 33.34%;
            height: 80%;                      



        }

        .right{
            background-color: lightcoral;
            width: 33.33%;
            height: 80%;                      

        }

        .footer{
            background-color: lightpink;
            height: 50px;
            width: 100%
            height: 10%;                      


        }
    </style>

</head>
<body>
    <div class="header">
        Header 100%
    </div>

<div class="container">
    <div class="left">Left 25%</div>

    <div class="center">Center 50%</div>

    <div class="right">Right 25%</div>
</div>

<div class="footer">Footer 100%</div>


</body>
</html>
